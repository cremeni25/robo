name: Validate API integration
on:
  pull_request:
    branches: [main]
  push:
    branches: [integracao-b1-awin-segura-20261009]
jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check Python syntax without production secrets
        run: python -m py_compile main.py
      - name: Verify canonical B1 commercial gates
        run: python -m unittest discover -s tests -p 'test_*.py' -v
